<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="clair.css">
<style>
    .aura-v { width: 760px; height: 760px; left: -300px; top: -320px; }
    .aura-m { width: 700px; height: 700px; right: -300px; bottom: -300px; }
    .pad { padding: 76px 76px 70px; }
    .logo { width: 300px; }
    .chip { font-size: 21px; padding: 15px 26px; margin-top: 44px; }
    .titre { font-size: 78px; margin-top: 28px; }
    .sous { font-size: 26px; margin-top: 22px; max-width: 820px; }
    .atouts { gap: 14px; margin-top: 30px; }
    .atout { font-size: 21px; padding: 14px 24px; }
    .rdv { padding: 26px 34px; gap: 30px; margin-top: auto; align-self: flex-start; }
    .rdv-jour { font-size: 56px; }
    .rdv-mois { font-size: 18px; margin-top: 6px; }
    .rdv-trait { width: 1.5px; height: 72px; }
    .rdv-lab { font-size: 18px; }
    .rdv-val { font-size: 30px; margin-top: 5px; }
    .url { font-size: 20px; margin-top: 26px; }
</style>
</head>
<body>
<div class="post carre">
    <div class="aura aura-v"></div>
    <div class="aura aura-m"></div>

    <div class="pad">
        <img class="logo" src="../assets/logos/logo-guestlucky-navy.png" alt="GuestLucky">

        <div class="chip"><span class="point"></span> Nouveau sur GuestLucky</div>

        <div class="titre">La <em>facturation électronique</em> est disponible.</div>

        <div class="sous">Éditez et envoyez vos factures conformes
            <b>sans quitter votre espace GuestLucky.</b></div>

        <div class="atouts">
            <div class="atout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg> Format Factur-X</div>
            <div class="atout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg> Conforme 2026</div>
            <div class="atout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg> Factures reçues et émises</div>
            <div class="atout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg> Facturation automatique</div>
        </div>

        <div class="rdv">
            <div>
                <div class="rdv-jour">13</div>
                <div class="rdv-mois">Août</div>
            </div>
            <div class="rdv-trait"></div>
            <div>
                <div class="rdv-lab">On vous montre tout en direct</div>
                <div class="rdv-val">Jeudi &agrave; 18h</div>
            </div>
        </div>

        <div class="url">guestlucky.com</div>
    </div>
</div>
</body>
</html>
