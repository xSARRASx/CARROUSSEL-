<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .halo-violet  { width: 780px; height: 780px; left: -260px; top: -200px; }
    .halo-magenta { width: 700px; height: 700px; right: -240px; bottom: -220px; }
    .pad { padding: 62px 62px 56px; }
    .logo { width: 290px; }
    .badge { font-size: 18px; padding: 13px 24px; margin-top: 34px; }
    .titre { font-size: 66px; margin-top: 24px; }

    .bas { display: flex; align-items: flex-end; gap: 40px; margin-top: auto; }
    .facture { padding: 26px 28px; flex: 1; }
    .f-titre { font-size: 24px; }
    .f-num { font-size: 16px; margin-top: 3px; }
    .f-tag { font-size: 13px; padding: 8px 14px; }
    .f-ligne { margin-top: 18px; }
    .f-barre { height: 11px; }
    .f-montant { font-size: 16px; }
    .f-sep { height: 1.5px; margin: 20px 0 16px; }
    .f-total-lab { font-size: 17px; }
    .f-total-val { font-size: 30px; }
    .f-conforme { font-size: 15px; padding: 11px 19px; gap: 8px; right: 24px; bottom: -18px; }

    .rdv { padding: 22px 26px; gap: 24px; flex-direction: column; align-items: flex-start; }
    .rdv-jour { font-size: 62px; }
    .rdv-mois { font-size: 18px; margin-top: 4px; }
    .rdv-trait { width: 100%; height: 1.5px; }
    .rdv-lab { font-size: 16px; }
    .rdv-val { font-size: 27px; margin-top: 4px; }
    .url { font-size: 19px; margin-top: 34px; }
</style>
</head>
<body>
<div class="post carre">
    <div class="halo halo-violet"></div>
    <div class="halo halo-magenta"></div>

    <div class="pad">
        <img class="logo" src="../assets/logos/logo-guestlucky-blanc.png" alt="GuestLucky">

        <div class="badge"><span class="point"></span> Nouveau</div>
        <div class="titre">La facturation électronique<br>est <em>disponible.</em></div>

        <div class="bas">
            <div class="facture">
                <div class="f-haut">
                    <div>
                        <div class="f-titre">Facture</div>
                        <div class="f-num">FA-2026-0142</div>
                    </div>
                    <div class="f-tag">Factur-X</div>
                </div>

                <div class="f-ligne">
                    <div class="f-barre" style="width: 46%;"></div>
                    <div class="f-montant">480,00 &euro;</div>
                </div>
                <div class="f-ligne">
                    <div class="f-barre" style="width: 62%;"></div>
                    <div class="f-montant">560,00 &euro;</div>
                </div>

                <div class="f-sep"></div>
                <div class="f-total">
                    <div class="f-total-lab">Total TTC</div>
                    <div class="f-total-val">1&nbsp;248,00&nbsp;&euro;</div>
                </div>

                <div class="f-conforme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"
                         stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg>
                    Conforme 2026
                </div>
            </div>

            <div class="rdv">
                <div>
                    <div class="rdv-jour">13</div>
                    <div class="rdv-mois">Août</div>
                </div>
                <div class="rdv-trait"></div>
                <div>
                    <div class="rdv-lab">En direct</div>
                    <div class="rdv-val">Jeudi &agrave; 18h</div>
                </div>
            </div>
        </div>

        <div class="url">guestlucky.com</div>
    </div>
</div>
</body>
</html>
