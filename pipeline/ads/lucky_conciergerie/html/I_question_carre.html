<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .voile-bas { background: linear-gradient(180deg, rgba(1,22,64,.62) 0%, rgba(1,22,64,.32) 24%,
                 rgba(1,22,64,.88) 60%, rgba(1,22,64,.98) 100%); }
    .pad { padding: 70px 66px 62px; justify-content: space-between; }
    .logo { width: 262px; }
    .titre { font-size: 76px; }
    .filet { width: 78px; height: 4px; margin-top: 34px; }
    .sous { font-size: 25px; margin-top: 24px; max-width: 800px; }
    .bas { display: flex; align-items: center; justify-content: space-between; margin-top: 42px; }
    .cta { font-size: 30px; padding: 29px 46px; gap: 16px; }
    .url { font-size: 23px; color: rgba(255,255,255,.60); }
</style>
</head>
<body>
<div class="ad carre">
    <img class="photo" src="../assets/backgrounds/soir_carre.png" alt="">
    <div class="voile voile-bas"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="titre">Votre conciergerie vous fait-elle vraiment <em>gagner de l'argent&nbsp;?</em></div>

            <div class="filet"></div>
            <div class="sous">Sans visibilité sur vos revenus, impossible de le savoir.
                <b>Les conciergeries certifiées Lucky jouent la transparence.</b></div>

            <div class="bas">
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
                <div class="url">luckyconciergerie.fr</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
