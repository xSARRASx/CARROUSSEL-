<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .voile-haut { background: linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,0) 26%); }
    .pad { padding: 84px 66px 74px; justify-content: space-between; }
    .logo { width: 300px; }
    .carte { padding: 66px 58px 60px; }
    .badge { font-size: 21px; padding: 19px 30px; margin-bottom: 40px; }
    .titre.sombre { font-size: 76px; }
    .sous.sombre { font-size: 31px; margin-top: 30px; }
    .cta { font-size: 34px; padding: 34px 0; margin-top: 46px; width: 100%;
           justify-content: center; gap: 18px; align-self: stretch; }
    .url { font-size: 26px; color: rgba(255,255,255,.92); margin-top: 40px;
           text-align: center; text-shadow: 0 2px 18px rgba(1,22,64,.6); }
</style>
</head>
<body>
<div class="ad story">
    <img class="photo" src="../assets/backgrounds/premium_story.png" alt="">
    <div class="voile voile-haut"></div>

    <div class="pad">
        <img class="logo" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="carte">
                <div class="badge">Mise en relation 100 % gratuite</div>
                <div class="titre sombre">Vous cherchez une conciergerie Airbnb <em>sérieuse&nbsp;?</em></div>
                <div class="sous sombre">Dites-nous où se trouve votre logement : on vous présente une
                    conciergerie <b>certifiée par nos équipes</b>, près de chez vous.</div>
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
            </div>
            <div class="url">luckyconciergerie.fr</div>
        </div>
    </div>
</div>
</body>
</html>
