<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .voile-bas { background: linear-gradient(180deg, rgba(1,22,64,.62) 0%, rgba(1,22,64,.30) 26%,
                 rgba(1,22,64,.86) 58%, rgba(1,22,64,.98) 100%); }
    .pad { padding: 92px 84px 84px; justify-content: space-between; }
    .logo { width: 310px; }
    .titre { font-size: 108px; }
    .filet { width: 96px; height: 5px; margin-top: 54px; }
    .sous { font-size: 33px; margin-top: 34px; max-width: 850px; }
    .cta { font-size: 36px; padding: 36px 58px; gap: 20px; margin-top: 62px; }
    .url { font-size: 27px; color: rgba(255,255,255,.60); margin-top: 52px; }
</style>
</head>
<body>
<div class="ad story">
    <img class="photo" src="../assets/backgrounds/soir_story.png" alt="">
    <div class="voile voile-bas"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="titre">Votre conciergerie vous fait-elle vraiment <em>gagner de l'argent&nbsp;?</em></div>

            <div class="filet"></div>
            <div class="sous">Sans visibilité sur vos revenus, impossible de le savoir.
                <b>Les conciergeries certifiées Lucky jouent la transparence.</b></div>

            <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
            <div class="url">luckyconciergerie.fr</div>
        </div>
    </div>
</div>
</body>
</html>
