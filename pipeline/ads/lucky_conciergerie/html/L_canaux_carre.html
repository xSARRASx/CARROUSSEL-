<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .ad.carre { background: linear-gradient(162deg, #041C4E 0%, var(--navy) 48%, #010F2E 100%); }
    .halo { position: absolute; width: 800px; height: 800px; left: -240px; top: 380px;
            background: radial-gradient(circle, rgba(176,138,62,.17) 0%, rgba(176,138,62,0) 66%); }
    .pad { padding: 70px 66px 62px; justify-content: space-between; }
    .logo { width: 262px; }
    .kicker { font-size: 21px; margin-bottom: 22px; }
    .titre { font-size: 66px; }
    .canaux { gap: 18px; margin-top: 40px; align-items: stretch; }
    .canal { flex: 1; padding: 24px 18px; height: 104px; }
    .canal img { max-width: 92%; width: auto; max-height: 56px; }
    .sous { font-size: 24px; margin-top: 32px; }
    .bas { display: flex; align-items: center; justify-content: space-between; margin-top: 40px; }
    .cta { font-size: 30px; padding: 29px 46px; gap: 16px; }
    .url { font-size: 23px; color: rgba(255,255,255,.60); }
</style>
</head>
<body>
<div class="ad carre">
    <div class="halo"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="kicker">Diffusion multi-plateformes</div>
            <div class="titre">Votre logement visible <em>partout où ça compte.</em></div>

            <div class="canaux">
                <div class="canal"><img src="../assets/logos/logo-airbnb.png" alt="Airbnb"></div>
                <div class="canal"><img src="../assets/logos/logo-booking.png" alt="Booking.com"></div>
                <div class="canal"><img src="../assets/logos/logo-abritel.png" alt="Abritel"></div>
            </div>

            <div class="sous">Annonce diffusée et calendriers synchronisés.
                <b>Plus de visibilité, plus de réservations.</b></div>

            <div class="bas">
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
                <div class="url">luckyconciergerie.fr</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
