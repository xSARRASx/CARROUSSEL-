<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .voile-haut { background: linear-gradient(180deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 30%); }
    .pad { padding: 58px 54px 52px; justify-content: space-between; }
    .logo { width: 262px; }
    .carte { padding: 50px 46px 46px; }
    .badge { font-size: 18px; padding: 15px 25px; margin-bottom: 28px; }
    .titre.sombre { font-size: 60px; }
    .sous.sombre { font-size: 25px; margin-top: 22px; }
    .cta { font-size: 28px; padding: 27px 0; margin-top: 34px; width: 100%;
           justify-content: center; gap: 15px; align-self: stretch; }
    .url { font-size: 22px; color: rgba(255,255,255,.92); margin-top: 26px;
           text-align: center; text-shadow: 0 2px 16px rgba(1,22,64,.6); }
</style>
</head>
<body>
<div class="ad carre">
    <img class="photo" src="../assets/backgrounds/premium_carre.png" alt="">
    <div class="voile voile-haut"></div>

    <div class="pad">
        <img class="logo" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="carte">
                <div class="badge">Mise en relation 100 % gratuite</div>
                <div class="titre sombre">Vous cherchez une conciergerie Airbnb <em>sérieuse&nbsp;?</em></div>
                <div class="sous sombre">On vous présente une conciergerie <b>certifiée par nos équipes</b>,
                    près de chez vous.</div>
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
            </div>
            <div class="url">luckyconciergerie.fr</div>
        </div>
    </div>
</div>
</body>
</html>
