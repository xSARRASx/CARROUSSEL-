<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .ad.carre { background: linear-gradient(160deg, #041C4E 0%, var(--navy) 50%, #010F2E 100%); }
    .halo { position: absolute; width: 760px; height: 760px; left: -240px; top: 420px;
            background: radial-gradient(circle, rgba(176,138,62,.18) 0%, rgba(176,138,62,0) 66%); }
    .pad { padding: 70px 68px 64px; justify-content: space-between; }
    .logo { width: 262px; }
    .corps { display: flex; align-items: center; gap: 52px; }
    .txt { flex: 1; }
    .kicker { font-size: 21px; margin-bottom: 22px; }
    .titre { font-size: 66px; }
    .stats { gap: 26px; align-items: center; margin-top: 34px; }
    .stat-n { font-size: 48px; }
    .stat-l { font-size: 19px; margin-top: 7px; max-width: 170px; }
    .sep { width: 2px; height: 70px; }
    .droite { width: 340px; flex: none; }
    .cal { gap: 11px; }
    .cal-legende { gap: 22px; margin-top: 22px; }
    .cal-legende > div { display: flex; align-items: center; gap: 10px; }
    .cal-pastille { width: 16px; height: 16px; }
    .cal-txt { font-size: 17px; }
    .bas { display: flex; align-items: center; justify-content: space-between; margin-top: 48px; }
    .cta { font-size: 30px; padding: 29px 46px; gap: 16px; }
    .url { font-size: 23px; color: rgba(255,255,255,.60); }
    .vignettes { gap: 16px; height: 142px; margin-top: 32px; }
</style>
</head>
<body>
<div class="ad carre">
    <div class="halo"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="corps">
                <div class="txt">
                    <div class="kicker">Taux d'occupation</div>
                    <div class="titre">Un calendrier <em>rempli</em>, pas un logement qui dort.</div>
                    <div class="stats">
                        <div>
                            <div class="stat-n">+40 %</div>
                            <div class="stat-l">de nuits réservées</div>
                        </div>
                        <div class="sep"></div>
                        <div>
                            <div class="stat-n">0 &euro;</div>
                            <div class="stat-l">pour vous</div>
                        </div>
                    </div>
                </div>

                <div class="droite">
                    <div class="cal">
                        <div class="cal-case pleine"></div><div class="cal-case pleine"></div>
                        <div class="cal-case vide"></div><div class="cal-case pleine"></div>
                        <div class="cal-case pleine"></div><div class="cal-case pleine"></div>
                        <div class="cal-case pleine"></div>

                        <div class="cal-case pleine"></div><div class="cal-case pleine"></div>
                        <div class="cal-case pleine"></div><div class="cal-case pleine"></div>
                        <div class="cal-case vide"></div><div class="cal-case pleine"></div>
                        <div class="cal-case pleine"></div>

                        <div class="cal-case pleine"></div><div class="cal-case vide"></div>
                        <div class="cal-case pleine"></div><div class="cal-case pleine"></div>
                        <div class="cal-case pleine"></div><div class="cal-case pleine"></div>
                        <div class="cal-case pleine"></div>

                        <div class="cal-case pleine"></div><div class="cal-case pleine"></div>
                        <div class="cal-case pleine"></div><div class="cal-case vide"></div>
                        <div class="cal-case pleine"></div><div class="cal-case pleine"></div>
                        <div class="cal-case pleine"></div>
                    </div>
                    <div class="cal-legende">
                        <div><div class="cal-pastille" style="background: linear-gradient(150deg,#D9B978,#B08A3E);"></div>
                             <div class="cal-txt">réservées</div></div>
                        <div><div class="cal-pastille" style="background: rgba(255,255,255,.09);"></div>
                             <div class="cal-txt">vides</div></div>
                    </div>
                </div>
            </div>

            <div class="vignettes">
                <div class="vignette"><img src="../assets/vignettes/salon.png" alt=""></div>
                <div class="vignette"><img src="../assets/vignettes/chambre.png" alt=""></div>
                <div class="vignette"><img src="../assets/vignettes/cles.png" alt=""></div>
            </div>

            <div class="bas">
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
                <div class="url">luckyconciergerie.fr</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
