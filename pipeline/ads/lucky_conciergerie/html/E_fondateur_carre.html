<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .pad { padding: 70px 66px 62px; justify-content: space-between; }
    .logo { width: 262px; }
    .guillemet { font-size: 150px; margin-bottom: -46px; }
    .quote { font-size: 62px; line-height: 1.12; }
    .signature { gap: 24px; margin-top: 44px; }
    .medaillon { width: 100px; height: 100px; font-size: 34px; }
    .signature-nom { font-size: 30px; }
    .signature-role { font-size: 21px; margin-top: 6px; line-height: 1.35; }
    .bas { display: flex; align-items: center; justify-content: space-between; margin-top: 50px; }
    .cta { font-size: 30px; padding: 29px 46px; gap: 16px; }
    .url { font-size: 23px; color: rgba(255,255,255,.60); }
</style>
</head>
<body>
<div class="ad carre">
    <img class="photo" src="../assets/backgrounds/soir_carre.png" alt="">
    <div class="voile voile-navy"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="guillemet">&laquo;</div>
            <div class="quote">Un beau logement ne suffit pas. C'est la conciergerie qui fait
                <em>la différence.</em></div>

            <div class="signature">
                <div class="medaillon">SM</div>
                <div>
                    <div class="signature-nom">Sébastien More</div>
                    <div class="signature-role">Fondateur &mdash; 9 ans dans la location courte durée</div>
                </div>
            </div>

            <div class="bas">
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
                <div class="url">luckyconciergerie.fr</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
