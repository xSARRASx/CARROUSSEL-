<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .pad { padding: 92px 84px 84px; justify-content: space-between; }
    .logo { width: 310px; }
    .kicker { font-size: 25px; margin-bottom: 30px; }
    .titre { font-size: 104px; }
    .liste { display: grid; grid-template-columns: 1fr 1fr; gap: 30px 40px; margin-top: 62px; }
    .puce { gap: 20px; }
    .ico { width: 50px; height: 50px; }
    .puce-txt { font-size: 27px; line-height: 1.3; }
    .cta { font-size: 36px; padding: 36px 58px; gap: 20px; margin-top: 72px; }
    .url { font-size: 27px; color: rgba(255,255,255,.60); margin-top: 52px; }
</style>
</head>
<body>
<div class="ad story">
    <img class="photo" src="../assets/backgrounds/premium_story.png" alt="">
    <div class="voile voile-navy"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="kicker">Votre bien, sans la charge mentale</div>
            <div class="titre">Vous ne vous occupez <em>de rien.</em></div>

            <div class="liste">
                <div class="puce">
                    <div class="ico ico-oui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg></div>
                    <div class="puce-txt sur-navy">Ménage et blanchisserie</div>
                </div>
                <div class="puce">
                    <div class="ico ico-oui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg></div>
                    <div class="puce-txt sur-navy">Accueil des voyageurs</div>
                </div>
                <div class="puce">
                    <div class="ico ico-oui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg></div>
                    <div class="puce-txt sur-navy">Annonces et photos</div>
                </div>
                <div class="puce">
                    <div class="ico ico-oui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg></div>
                    <div class="puce-txt sur-navy">Prix ajustés en continu</div>
                </div>
                <div class="puce">
                    <div class="ico ico-oui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg></div>
                    <div class="puce-txt sur-navy">Messages 24h/24</div>
                </div>
                <div class="puce">
                    <div class="ico ico-oui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l5 5L19 7"/></svg></div>
                    <div class="puce-txt sur-navy">Incidents pris en charge</div>
                </div>
            </div>

            <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
            <div class="url">luckyconciergerie.fr</div>
        </div>
    </div>
</div>
</body>
</html>
