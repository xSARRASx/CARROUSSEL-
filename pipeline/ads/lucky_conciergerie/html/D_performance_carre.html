<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .ad.carre { background: linear-gradient(160deg, #041C4E 0%, var(--navy) 50%, #010F2E 100%); }
    .halo { position: absolute; width: 820px; height: 820px; right: -280px; top: 220px;
            background: radial-gradient(circle, rgba(176,138,62,.20) 0%, rgba(176,138,62,0) 66%); }
    .pad { padding: 70px 68px 64px; justify-content: space-between; }
    .haut { display: flex; align-items: flex-start; justify-content: space-between; }
    .logo { width: 262px; }
    .corps { display: flex; align-items: flex-end; gap: 54px; }
    .txt { flex: 1; }
    .kicker { font-size: 21px; margin-bottom: 22px; }
    .titre { font-size: 68px; }
    .sous { font-size: 24px; margin-top: 22px; }
    .graph { width: 330px; flex: none; height: 400px; gap: 30px; }
    .gval { font-size: 44px; margin-bottom: 16px; }
    .gcol-avant { height: 44%; }
    .gcol-apres { height: 100%; }
    .glabel { font-size: 18px; margin-top: 18px; line-height: 1.3; }
    .bas { display: flex; align-items: center; justify-content: space-between; margin-top: 52px; }
    .cta { font-size: 30px; padding: 29px 46px; gap: 16px; }
    .url { font-size: 23px; color: rgba(255,255,255,.60); }
</style>
</head>
<body>
<div class="ad carre">
    <div class="halo"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="corps">
                <div class="txt">
                    <div class="kicker">Conciergeries certifiées</div>
                    <div class="titre">Votre logement peut rapporter <em>bien plus.</em></div>
                    <div class="sous">Tarification dynamique, annonce optimisée,
                        calendrier rempli.</div>
                </div>

                <div class="graph">
                    <div class="gbar">
                        <div class="gcol gcol-avant"></div>
                        <div class="glabel"><b>Géré seul</b>revenus de base</div>
                    </div>
                    <div class="gbar">
                        <div class="gval">+36 %</div>
                        <div class="gcol gcol-apres"></div>
                        <div class="glabel"><b>Certifiée Lucky</b>revenus optimisés</div>
                    </div>
                </div>
            </div>

            <div class="bas">
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
                <div class="url">luckyconciergerie.fr</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
