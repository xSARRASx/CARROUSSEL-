<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .ad.carre { background: var(--creme); }
    .photo { height: 330px; bottom: auto; }
    .fondu { position: absolute; top: 0; left: 0; right: 0; height: 330px;
             background: linear-gradient(180deg, rgba(244,236,223,.22) 0%,
                         rgba(244,236,223,.60) 55%, var(--creme) 100%); }
    .pad { padding: 62px 58px 56px; justify-content: space-between; }
    .logo { width: 258px; }
    .corps { margin-top: auto; }
    .titre.sombre { font-size: 64px; }
    .villes { gap: 13px; margin-top: 34px; }
    .ville { font-size: 20px; padding: 13px 22px; }
    .sous.sombre { font-size: 23px; margin-top: 32px; }
    .bas { display: flex; align-items: center; justify-content: space-between; margin-top: 38px; }
    .cta { font-size: 28px; padding: 27px 44px; gap: 15px; }
    .url { font-size: 21px; color: var(--gris); }
</style>
</head>
<body>
<div class="ad carre">
    <img class="photo" src="../assets/backgrounds/clair_carre.png" alt="">
    <div class="fondu"></div>

    <div class="pad">
        <img class="logo" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div class="corps">
            <div class="titre sombre">Une conciergerie certifiée <em>près de chez vous.</em></div>

            <div class="villes">
                <div class="ville claire">Paris</div>
                <div class="ville claire">Lyon</div>
                <div class="ville claire">Marseille</div>
                <div class="ville claire">Bordeaux</div>
                <div class="ville claire">Lille</div>
                <div class="ville claire">Toulouse</div>
                <div class="ville claire">Nantes</div>
                <div class="ville claire">Nice</div>
                <div class="ville or">et partout ailleurs</div>
            </div>

            <div class="sous sombre">Donnez-nous votre code postal :
                <b>on vous présente la conciergerie de votre secteur.</b></div>

            <div class="bas">
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
                <div class="url">luckyconciergerie.fr</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
