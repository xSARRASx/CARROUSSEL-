<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .ad.paysage { background: linear-gradient(150deg, #041C4E 0%, var(--navy) 52%, #010F2E 100%); }
    .halo { position: absolute; width: 660px; height: 660px; right: -180px; top: 60px;
            background: radial-gradient(circle, rgba(176,138,62,.20) 0%, rgba(176,138,62,0) 66%); }
    .pad { padding: 50px 54px 46px; flex-direction: row; gap: 46px; align-items: stretch; }
    .txt { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .logo { width: 206px; }
    .kicker { font-size: 15px; margin-bottom: 15px; }
    .titre { font-size: 46px; }
    .sous { font-size: 18px; margin-top: 14px; max-width: 480px; }
    .bas { display: flex; align-items: center; gap: 24px; }
    .cta { font-size: 21px; padding: 20px 32px; gap: 12px; }
    .url { font-size: 16px; color: rgba(255,255,255,.60); }
    .graph { width: 290px; flex: none; height: 330px; gap: 26px; align-self: center; }
    .gval { font-size: 38px; margin-bottom: 13px; }
    .gcol-avant { height: 44%; }
    .gcol-apres { height: 100%; }
    .glabel { font-size: 15px; margin-top: 15px; line-height: 1.3; }
</style>
</head>
<body>
<div class="ad paysage">
    <img class="photo" src="../assets/backgrounds/soir_paysage.png" alt="">
    <div class="voile voile-sombre"></div>
    <div class="halo"></div>

    <div class="pad">
        <div class="txt">
            <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

            <div>
                <div class="kicker">Conciergeries certifiées</div>
                <div class="titre">Votre logement peut rapporter <em>bien plus.</em></div>
                <div class="sous">Tarification dynamique, annonce optimisée, calendrier rempli.</div>
            </div>

            <div class="bas">
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
                <div class="url">luckyconciergerie.fr</div>
            </div>
        </div>

        <div class="graph">
            <div class="gbar">
                <div class="gcol gcol-avant"></div>
                <div class="glabel"><b>Géré seul</b></div>
            </div>
            <div class="gbar">
                <div class="gval">+36 %</div>
                <div class="gcol gcol-apres"></div>
                <div class="glabel"><b>Certifiée Lucky</b></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
