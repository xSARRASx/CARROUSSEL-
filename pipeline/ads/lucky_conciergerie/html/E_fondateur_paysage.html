<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .pad { padding: 50px 54px 46px; justify-content: space-between; width: 800px; }
    .logo { width: 206px; }
    .guillemet { font-size: 96px; margin-bottom: -30px; }
    .quote { font-size: 44px; line-height: 1.14; max-width: 660px; }
    .signature { gap: 18px; margin-top: 26px; }
    .medaillon { width: 68px; height: 68px; font-size: 24px; }
    .signature-nom { font-size: 22px; }
    .signature-role { font-size: 16px; margin-top: 4px; line-height: 1.3; }
    .bas { display: flex; align-items: center; gap: 24px; }
    .cta { font-size: 21px; padding: 20px 32px; gap: 12px; }
    .url { font-size: 16px; color: rgba(255,255,255,.60); }
</style>
</head>
<body>
<div class="ad paysage">
    <img class="photo" src="../assets/backgrounds/soir_paysage.png" alt="">
    <div class="voile voile-gauche"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="guillemet">&laquo;</div>
            <div class="quote">Un beau logement ne suffit pas. C'est la conciergerie qui fait
                <em>la différence.</em></div>

            <div class="signature">
                <div class="medaillon">SM</div>
                <div>
                    <div class="signature-nom">Sébastien More</div>
                    <div class="signature-role">Fondateur &mdash; 9 ans dans la location courte durée</div>
                </div>
            </div>
        </div>

        <div class="bas">
            <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
            <div class="url">luckyconciergerie.fr</div>
        </div>
    </div>
</div>
</body>
</html>
