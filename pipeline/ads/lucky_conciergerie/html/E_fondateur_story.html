<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .pad { padding: 92px 84px 84px; justify-content: space-between; }
    .logo { width: 310px; }
    .guillemet { font-size: 200px; margin-bottom: -60px; }
    .quote { font-size: 84px; line-height: 1.12; }
    .signature { gap: 30px; margin-top: 66px; }
    .medaillon { width: 128px; height: 128px; font-size: 44px; }
    .signature-nom { font-size: 38px; }
    .signature-role { font-size: 25px; margin-top: 8px; line-height: 1.35; }
    .filet { width: 96px; height: 5px; margin-top: 62px; }
    .sous { font-size: 30px; margin-top: 34px; max-width: 840px; }
    .cta { font-size: 36px; padding: 36px 58px; gap: 20px; margin-top: 58px; }
    .url { font-size: 27px; color: rgba(255,255,255,.60); margin-top: 52px; }
</style>
</head>
<body>
<div class="ad story">
    <img class="photo" src="../assets/backgrounds/soir_story.png" alt="">
    <div class="voile voile-navy"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="guillemet">&laquo;</div>
            <div class="quote">Un beau logement ne suffit pas. C'est la conciergerie qui fait
                <em>la différence.</em></div>

            <div class="signature">
                <div class="medaillon">SM</div>
                <div>
                    <div class="signature-nom">Sébastien More</div>
                    <div class="signature-role">Fondateur &mdash; 9 ans dans la location courte durée</div>
                </div>
            </div>

            <div class="filet"></div>
            <div class="sous">On vous présente une conciergerie certifiée près de chez vous.
                <b>Notre mise en relation est gratuite.</b></div>

            <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
            <div class="url">luckyconciergerie.fr</div>
        </div>
    </div>
</div>
</body>
</html>
