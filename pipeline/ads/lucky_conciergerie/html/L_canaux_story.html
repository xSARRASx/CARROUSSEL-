<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .ad.story { background: linear-gradient(172deg, #041C4E 0%, var(--navy) 48%, #010F2E 100%); }
    .halo { position: absolute; width: 1050px; height: 1050px; left: -300px; top: 560px;
            background: radial-gradient(circle, rgba(176,138,62,.17) 0%, rgba(176,138,62,0) 66%); }
    .pad { padding: 92px 84px 84px; justify-content: space-between; }
    .logo { width: 310px; }
    .kicker { font-size: 25px; margin-bottom: 30px; }
    .titre { font-size: 100px; }
    .canaux { flex-direction: column; gap: 22px; margin-top: 62px; align-items: stretch; }
    .canal { padding: 34px 46px; height: 132px; }
    .canal img { max-width: 430px; width: auto; max-height: 78px; }
    .sous { font-size: 31px; margin-top: 46px; max-width: 850px; }
    .cta { font-size: 36px; padding: 36px 58px; gap: 20px; margin-top: 58px; }
    .url { font-size: 27px; color: rgba(255,255,255,.60); margin-top: 48px; }
    .vignettes { gap: 20px; height: 232px; margin-top: 58px; }
</style>
</head>
<body>
<div class="ad story">
    <div class="halo"></div>

    <div class="pad">
        <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

        <div>
            <div class="kicker">Diffusion multi-plateformes</div>
            <div class="titre">Votre logement visible <em>partout où ça compte.</em></div>

            <div class="canaux">
                <div class="canal"><img src="../assets/logos/logo-airbnb.png" alt="Airbnb"></div>
                <div class="canal"><img src="../assets/logos/logo-booking.png" alt="Booking.com"></div>
                <div class="canal"><img src="../assets/logos/logo-abritel.png" alt="Abritel"></div>
            </div>

            <div class="sous">Annonce diffusée et calendriers synchronisés sur les grandes plateformes.
                <b>Plus de visibilité, plus de réservations.</b></div>

            <div class="vignettes">
                <div class="vignette"><img src="../assets/vignettes/salon.png" alt=""></div>
                <div class="vignette"><img src="../assets/vignettes/chambre.png" alt=""></div>
                <div class="vignette"><img src="../assets/vignettes/cles.png" alt=""></div>
            </div>

            <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
            <div class="url">luckyconciergerie.fr</div>
        </div>
    </div>
</div>
</body>
</html>
