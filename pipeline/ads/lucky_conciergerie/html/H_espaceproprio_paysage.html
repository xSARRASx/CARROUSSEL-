<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
    .ad.paysage { background: linear-gradient(150deg, #041C4E 0%, var(--navy) 50%, #010F2E 100%); }
    .halo { position: absolute; width: 640px; height: 640px; right: -190px; top: 120px;
            background: radial-gradient(circle, rgba(176,138,62,.17) 0%, rgba(176,138,62,0) 66%); }
    .pad { padding: 50px 54px 46px; flex-direction: row; gap: 40px; align-items: stretch; }
    .txt { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .logo { width: 206px; }
    .kicker { font-size: 15px; margin-bottom: 14px; }
    .titre { font-size: 44px; }
    .sous { font-size: 17px; margin-top: 13px; max-width: 440px; }
    .bas { display: flex; align-items: center; gap: 22px; }
    .cta { font-size: 21px; padding: 20px 32px; gap: 12px; }
    .url { font-size: 16px; color: rgba(255,255,255,.60); }
    .kpis { width: 330px; flex: none; gap: 14px; align-self: center; }
    .kpi { padding: 20px 18px; }
    .kpi-lab { font-size: 14px; margin-bottom: 8px; }
    .kpi-val { font-size: 32px; }
</style>
</head>
<body>
<div class="ad paysage">
    <div class="halo"></div>

    <div class="pad">
        <div class="txt">
            <img class="logo logo-blanc" src="../assets/logos/logo-lucky-conciergerie.png" alt="">

            <div>
                <div class="kicker">Votre espace propriétaire</div>
                <div class="titre">Vos revenus, en direct, <em>à tout moment.</em></div>
                <div class="sous">Vous voyez tout, sans rien demander.</div>
            </div>

            <div class="bas">
                <div class="cta">Trouver ma conciergerie <svg class="fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
                <div class="url">luckyconciergerie.fr</div>
            </div>
        </div>

        <div class="kpis">
            <div class="kpi">
                <div class="kpi-lab">Taux d'occupation</div>
                <div class="kpi-val or">82 %</div>
            </div>
            <div class="kpi">
                <div class="kpi-lab">Prix moyen / nuit</div>
                <div class="kpi-val">118 &euro;</div>
            </div>
            <div class="kpi">
                <div class="kpi-lab">Réservations</div>
                <div class="kpi-val">14</div>
            </div>
            <div class="kpi">
                <div class="kpi-lab">Incidents</div>
                <div class="kpi-val">0</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
