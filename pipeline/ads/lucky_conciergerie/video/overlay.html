<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face {
    font-family: 'Manrope';
    src: url('../assets/fonts/manrope-latin-var.woff2') format('woff2');
    font-weight: 200 800;
    font-display: block;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: transparent; }
body { font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }

.cadre { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

/* voile sombre progressif : garantit la lisibilite du texte sur n'importe quel plan */
.voile {
    position: absolute; left: 0; right: 0; bottom: 0; height: 900px;
    background: linear-gradient(180deg, rgba(1,22,64,0) 0%, rgba(1,22,64,.55) 42%,
                rgba(1,22,64,.88) 100%);
}
.texte {
    position: absolute; left: 78px; right: 78px; bottom: 360px;
    font-weight: 800; font-size: 82px; line-height: 1.12; letter-spacing: -.025em;
    color: #FFFFFF; text-shadow: 0 6px 40px rgba(0,0,0,.55);
}
.texte em { font-style: normal; color: #D9B978; }
.texte.petit { font-size: 62px; }

/* bandeau de marque discret, present tout du long */
.marque {
    position: absolute; left: 78px; bottom: 210px;
    display: flex; align-items: center; gap: 20px;
}
.marque img { width: 250px; filter: brightness(0) invert(1); opacity: .95; }
.pastille {
    background: #B08A3E; color: #fff; font-weight: 800; font-size: 24px;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 16px 26px; border-radius: 999px;
}
</style>
</head>
<body>
<div class="cadre">
    <div class="voile"></div>
    <div class="texte" id="txt"></div>
    <div class="marque">
        <img src="../assets/logos/logo-lucky-conciergerie.png" alt="">
    </div>
</div>
</body>
</html>
